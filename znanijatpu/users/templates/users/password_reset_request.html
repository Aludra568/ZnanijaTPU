{% extends 'main/layout.html' %}
{% block title %}Сброс пароля{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 450px;">
    <h3 class="text-center mb-3">🔑 Восстановление пароля</h3>
    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Email аккаунта</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Отправить код</button>
    </form>
    {% if messages %}{% for m in messages %}<div class="alert alert-{{ m.tags }} mt-3 small">{{ m }}</div>{% endfor %}{% endif %}
</div>
{% endblock %}
