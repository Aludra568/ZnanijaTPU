{% extends 'main/layout.html' %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 450px;">
    <h3 class="mb-2 text-center">🔐 Введите код и новый пароль</h3>
    <p class="text-center text-muted mb-4">Код отправлен на <strong>{{ email }}</strong></p>
    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Код из письма</label>
            <input type="text" name="code" class="form-control text-center fs-4" maxlength="6" pattern="[0-9]{6}" placeholder="******" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Новый пароль</label>
            <input type="password" name="password1" class="form-control" placeholder="Минимум 8 символов" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Повторите пароль</label>
            <input type="password" name="password2" class="form-control" placeholder="Повторите пароль" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Сохранить</button>
    </form>
    {% if messages %}
        {% for msg in messages %}<div class="alert alert-{{ msg.tags }} mt-3">{{ msg }}</div>{% endfor %}
    {% endif %}
</div>
{% endblock %}
