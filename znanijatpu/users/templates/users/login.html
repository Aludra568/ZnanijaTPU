{% extends "main/layout.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Вход в систему</h2>
            
            <form method="post">
                {% csrf_token %}
                
                <!-- Общие ошибки (неправильный логин/пароль) -->
                {{ form.non_field_errors }}
                
                <div class="mb-3">
                    <label for="id_username" class="form-label">Имя пользователя</label>
                    <input type="text" name="username" class="form-control" id="id_username" required>
                    {{ form.username.errors }}
                </div>
                
                <div class="mb-3">
                    <label for="id_password" class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" id="id_password" required>
                    {{ form.password.errors }}
                </div>
                
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fa-solid fa-sign-in-alt"></i> Войти
                </button>
            </form>
            
            <p class="mt-3 text-center">
                Нет аккаунта? <a href="{% url 'users:register' %}" class="text-muted small">Зарегистрироваться</a> 
            </p>
            <p class="mt-3 text-center">
                <a href="{% url 'users:password_reset' %}" class="text-muted small">Забыли пароль?</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
